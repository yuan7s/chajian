name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

env:
  PROJECT_NAME: chajian
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild 外部程序.vbproj -p:Configuration=Release -p:Platform="AnyCPU" -v:minimal -t:Build

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p publish
          cp bin/Release/外部程序.exe publish/
          cp bin/Release/外部程序.exe.config publish/
          cp bin/Release/外部程序.pdb publish/
          cp bin/Release/外部程序.xml publish/

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "${env:PROJECT_NAME}.zip" -Force

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $lines = Get-Content -Path CHANGELOG.md -Encoding UTF8
          $start = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($tag))(\s|$)") {
              $start = $i
              break
            }
          }

          if ($start -lt 0) {
            $previousTag = git describe --tags --abbrev=0 "$tag^{}^" 2>$null
            if ($LASTEXITCODE -eq 0 -and $previousTag) {
              $notes = "Full Changelog: https://github.com/${{ github.repository }}/compare/$previousTag...$tag"
            } else {
              $notes = "Release: https://github.com/${{ github.repository }}/releases/tag/$tag"
            }
          } else {
            $end = $lines.Count
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s+') {
                $end = $i
                break
              }
            }

            $notes = ($lines[$start..($end - 1)] -join [Environment]::NewLine).Trim()
          }

          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

      - name: Create or Update Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $asset = "${env:PROJECT_NAME}.zip#${env:PROJECT_NAME}.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $tag --notes-file release-notes.md
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title $tag --notes-file release-notes.md --target '${{ github.sha }}'
          }
