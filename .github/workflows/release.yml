name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

env:
  PROJECT_NAME: ExternalProgram
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ExternalProgram.sln

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build ExternalProgram.SwAddin/ExternalProgram.SwAddin.csproj -c Release --no-restore -v minimal
          dotnet build ExternalProgram.sln -c Release --no-restore -v minimal

      - name: Package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $externalProgramOut = 'bin/Release/net9.0-windows'
          $readBomOut = 'ReadBom/bin/Release/net9.0-windows'
          $addinOut = 'ExternalProgram.SwAddin/bin/Release/net48'

          $externalProgramPublish = 'publish/ExternalProgram'
          $readBomPublish = 'publish/ReadBom'

          New-Item -ItemType Directory -Force -Path $externalProgramPublish, $readBomPublish | Out-Null

          $externalProgramFiles = @(
            'ExternalProgram.exe',
            'ExternalProgram.dll',
            'ExternalProgram.dll.config',
            'ExternalProgram.deps.json',
            'ExternalProgram.runtimeconfig.json',
            'Wpf.Ui.dll',
            'Wpf.Ui.Abstractions.dll',
            'ExternalProgram.SwAddin.dll',
            'Interop.SldWorks.dll',
            'Interop.SwConst.dll',
            'SolidWorks.Interop.swdocumentmgr.dll',
            'SolidWorks.Interop.swpublished.dll',
            'SolidWorksTools.dll'
          )

          $readBomFiles = @(
            'ReadBom.exe',
            'ReadBom.dll',
            'ReadBom.deps.json',
            'ReadBom.runtimeconfig.json',
            'Wpf.Ui.dll',
            'Wpf.Ui.Abstractions.dll',
            'SolidWorks.Interop.swdocumentmgr.dll'
          )

          $addinFiles = @(
            'ExternalProgram.SwAddin.dll',
            'Interop.SldWorks.dll',
            'Interop.SwConst.dll',
            'SolidWorks.Interop.swdocumentmgr.dll',
            'SolidWorks.Interop.swpublished.dll',
            'SolidWorksTools.dll'
          )

          foreach ($file in $externalProgramFiles) {
            $source = Join-Path $externalProgramOut $file
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Missing ExternalProgram release file: $source"
            }
            Copy-Item -LiteralPath $source -Destination $externalProgramPublish
          }

          foreach ($file in $readBomFiles) {
            $source = Join-Path $readBomOut $file
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Missing ReadBom release file: $source"
            }
            Copy-Item -LiteralPath $source -Destination $readBomPublish
          }

          foreach ($file in $addinFiles) {
            $source = Join-Path $addinOut $file
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Missing add-in release file: $source"
            }
          }

          $externalProgramCultureFile = "$externalProgramOut/zh-CN/ExternalProgram.resources.dll"
          if (Test-Path -LiteralPath $externalProgramCultureFile) {
            New-Item -ItemType Directory -Force -Path "$externalProgramPublish/zh-CN" | Out-Null
            Copy-Item -LiteralPath $externalProgramCultureFile -Destination "$externalProgramPublish/zh-CN"
          }

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "${env:PROJECT_NAME}.zip" -Force

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'

          if (-not (Test-Path -LiteralPath CHANGELOG.md)) {
            $previousTag = git describe --tags --abbrev=0 "$tag^{}^" 2>$null
            if ($LASTEXITCODE -eq 0 -and $previousTag) {
              $notes = "Full Changelog: https://github.com/${{ github.repository }}/compare/$previousTag...$tag"
            } else {
              $notes = "Release: https://github.com/${{ github.repository }}/releases/tag/$tag"
            }

            Set-Content -Path release-notes.md -Value $notes -Encoding UTF8
            return
          }

          $lines = Get-Content -Path CHANGELOG.md -Encoding UTF8
          $start = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($tag))(\s|$)") {
              $start = $i
              break
            }
          }

          if ($start -lt 0) {
            $previousTag = git describe --tags --abbrev=0 "$tag^{}^" 2>$null
            if ($LASTEXITCODE -eq 0 -and $previousTag) {
              $notes = "Full Changelog: https://github.com/${{ github.repository }}/compare/$previousTag...$tag"
            } else {
              $notes = "Release: https://github.com/${{ github.repository }}/releases/tag/$tag"
            }
          } else {
            $end = $lines.Count
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s+') {
                $end = $i
                break
              }
            }

            $notes = ($lines[$start..($end - 1)] -join [Environment]::NewLine).Trim()
          }

          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

      - name: Create or Update Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $asset = "${env:PROJECT_NAME}.zip#${env:PROJECT_NAME}.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $tag --notes-file release-notes.md
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title $tag --notes-file release-notes.md --target '${{ github.sha }}'
          }
