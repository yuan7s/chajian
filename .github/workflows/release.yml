name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

env:
  PROJECT_NAME: chajian

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild 外部程序.vbproj -p:Configuration=Release -p:Platform="AnyCPU" -v:minimal -t:Build

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p publish
          cp bin/Release/外部程序.exe publish/
          cp bin/Release/外部程序.exe.config publish/
          cp bin/Release/外部程序.pdb publish/
          cp bin/Release/外部程序.xml publish/

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath $env:PROJECT_NAME.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}
          path: ${{ env.PROJECT_NAME }}.zip

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $lines = Get-Content -Path CHANGELOG.md -Encoding UTF8
          $start = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($tag))(\s|$)") {
              $start = $i
              break
            }
          }

          if ($start -lt 0) {
            $notes = "Full Changelog: https://github.com/${{ github.repository }}/compare/v1.0.10...$tag"
          } else {
            $end = $lines.Count
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s+') {
                $end = $i
                break
              }
            }

            $notes = ($lines[$start..($end - 1)] -join [Environment]::NewLine).Trim()
          }

          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

      - name: Create or Update Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ env.PROJECT_NAME }}.zip
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
