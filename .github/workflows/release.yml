name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild 外部程序.vbproj -p:Configuration=Release -p:Platform="AnyCPU" -v:minimal -t:Build

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p publish
          cp bin/Release/外部程序.exe publish/
          cp bin/Release/外部程序.exe.config publish/
          cp bin/Release/外部程序.pdb publish/
          cp bin/Release/外部程序.xml publish/

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath 外部程序.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 外部程序
          path: publish/

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ github.ref_name }}" \
            -f target_commitish="${{ github.sha }}" \
            --jq '.body')
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: 外部程序.zip
          artifactErrorsFailBuild: true
          allowUpdates: true
          updateOnlyUnreleased: false
          draft: false
          prerelease: false
          body: ${{ steps.release_notes.outputs.notes }}
          removeArtifacts: true
