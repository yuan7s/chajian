<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SolidWorks 控制台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <strong class="app-brand">SolidWorks 控制台</strong>
    <span class="connection-state"><span id="status-dot" class="status-dot"></span>
    <span id="status-text">连接中…</span></span>
    <span class="sep">|</span>
    <span id="doc-name">无文档</span>
    <button id="property-toggle" class="property-toggle" type="button">属性</button>
  </header>

  <main id="toolbar" class="toolbar"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- 属性面板：跟随当前文档或选中组件 -->
  <aside id="property-panel" class="property-panel" aria-label="零件属性" hidden>
    <div class="property-header">
      <div><small>零件属性 · 自动跟随选择</small><h2 id="prop-title">正在读取…</h2></div>
      <button id="prop-settings" type="button">设置</button>
      <button id="property-close" class="modal-close" type="button" aria-label="关闭属性栏">×</button>
    </div>
    <div class="property-context"><span id="prop-context"></span><div id="prop-path"></div></div>
    <div class="property-controls" hidden>
      <label>属性来源<select id="prop-source"><option value="configuration">配置特定</option><option value="custom">自定义</option></select></label>
      <label>显示范围<select id="prop-scope"><option value="key">关键属性</option><option value="all">全部属性</option></select></label>
    </div>
    <div class="property-tools">
      <input id="prop-search" type="search" placeholder="搜索属性名或值" aria-label="搜索属性名或值" />
      <label hidden><input id="prop-hide-empty" type="checkbox" /> 隐藏空值</label>
      <div><button id="prop-refresh" type="button">刷新</button><button id="prop-copy" type="button" disabled>复制显示项</button></div>
    </div>
    <div id="prop-status" class="property-status" role="status"></div>
    <div id="prop-list" class="property-list"></div>
    <div class="property-edit-actions">
      <button id="prop-edit" type="button" disabled>编辑属性</button>
      <button id="prop-save" type="button" hidden>写入修改</button>
      <button id="prop-cancel" type="button" hidden>取消编辑</button>
      <span id="prop-edit-note"></span>
    </div>
    <footer id="prop-count" class="property-footer"></footer>
  </aside>

  <!-- 属性栏独立设置，保存后生效 -->
  <div id="modal-property-settings" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="prop-settings-title">
      <div class="modal-header"><span id="prop-settings-title">属性栏设置</span><button type="button" class="modal-close" aria-label="关闭属性栏设置" data-close>×</button></div>
      <div class="modal-body">
        <label>属性来源<select id="ps-source"><option value="configuration">配置特定</option><option value="custom">自定义</option></select></label>
        <label>显示范围<select id="ps-scope"><option value="key">关键属性</option><option value="all">全部属性</option></select></label>
        <label><input id="ps-hide-empty" type="checkbox" /> 隐藏空值</label>
        <h3 class="ps-heading">关键属性</h3>
        <p class="ps-help">填写 SolidWorks 中的属性名称，按下方顺序显示。修改此列表只影响属性栏显示。</p>
        <div id="ps-key-list"></div>
        <div class="ps-actions"><button id="ps-add" type="button">添加属性</button><button id="ps-reset" type="button">恢复默认列表</button></div>
        <p id="ps-error" role="alert"></p>
      </div>
      <div class="modal-footer"><button id="ps-save" type="button" class="primary">保存设置</button><button type="button" data-close>取消</button></div>
    </div>
  </div>

  <!-- 编码整理模态框 -->
  <div id="modal-coding-cleanup" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <span>编码整理</span>
        <button class="modal-close" type="button" aria-label="关闭弹窗" data-close>×</button>
      </div>
      <div class="modal-body">
        <label>名称过滤
          <input id="cc-name-filter" type="text" placeholder="留空则处理全部组件" />
        </label>
        <label><input id="cc-process-asm" type="checkbox" /> 处理装配体</label>
        <label><input id="cc-process-part" type="checkbox" /> 处理零件</label>
        <label><input id="cc-exclude-virtual" type="checkbox" /> 排除虚拟件</label>
        <label><input id="cc-exclude-standard" type="checkbox" /> 排除标准件</label>
        <label><input id="cc-exclude-purchased" type="checkbox" /> 排除外购件</label>
      </div>
      <div class="modal-footer">
        <button id="cc-execute" class="primary" type="button">执行</button>
        <button type="button" data-close>取消</button>
      </div>
    </div>
  </div>

  <!-- 重命名模态框 -->
  <div id="modal-rename" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <span>重命名</span>
        <button class="modal-close" type="button" aria-label="关闭弹窗" data-close>×</button>
      </div>
      <div class="modal-body">
        <div class="rename-row">
          <label>原文件名
            <input id="rn-old-name" type="text" readonly />
          </label>
          <span id="rn-ext" class="rn-ext"></span>
        </div>
        <div class="rename-row">
          <label>新文件名
            <input id="rn-new-name" type="text" />
          </label>
          <span id="rn-name-status" class="rn-status"></span>
        </div>

        <details class="rename-params">
          <summary>重命名参数</summary>
          <label>属性目标
            <select id="rn-property-target">
              <option value="configuration">配置特定</option>
              <option value="custom">自定义</option>
            </select>
          </label>
          <label><input id="rn-write-filename" type="checkbox" /> 写文件名称</label>
          <label><input id="rn-write-material-code" type="checkbox" /> 写物料编码</label>
          <label><input id="rn-write-part-number" type="checkbox" /> 写零件图号</label>
          <label><input id="rn-write-design" type="checkbox" /> 写设计出图</label>
          <label>设计者/出图者 <input id="rn-design-text" type="text" /></label>
          <label><input id="rn-write-version" type="checkbox" /> 写版本</label>
          <label>版本文本 <input id="rn-version-text" type="text" /></label>
        </details>
      </div>
      <div class="modal-footer">
        <button id="rn-rename" class="primary" type="button">重命名</button>
        <button id="rn-save-as" type="button">另存为</button>
        <button id="rn-save-as-replace" type="button">另存替换</button>
        <button type="button" data-close>取消</button>
      </div>
    </div>
  </div>

  <!-- 装配体排序模态框 -->
  <div id="modal-sort" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <span>装配体排序</span>
        <button class="modal-close" type="button" aria-label="关闭弹窗" data-close>×</button>
      </div>
      <div class="modal-body">
        <label><input id="sort-assembly-first" type="checkbox" /> 装配体优先</label>
        <label><input id="sort-suppressed-last" type="checkbox" /> 压缩件靠后</label>
        <label><input id="sort-folders" type="checkbox" /> 按文件夹排序</label>
        <label><input id="sort-recursive" type="checkbox" /> 递归子装配体</label>
        <label><input id="sort-descending" type="checkbox" /> 降序</label>
        <label>名称来源
          <select id="sort-name-source">
            <option value="ComponentName">组件名</option>
            <option value="FileName">文件名</option>
          </select>
        </label>
      </div>
      <div class="modal-footer">
        <button id="sort-execute" class="primary" type="button">执行排序</button>
        <button type="button" data-close>取消</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
