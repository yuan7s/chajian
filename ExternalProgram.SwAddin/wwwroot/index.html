<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SolidWorks 控制台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span id="status-dot" class="status-dot"></span>
    <span id="status-text">连接中…</span>
    <span class="sep">|</span>
    <span id="doc-name">无文档</span>
    <button id="settings-toggle" class="settings-toggle" type="button">⚙ 设置</button>
  </header>

  <section id="settings-panel" class="settings-panel" hidden>
    <h3>绘图标准（「标准格式」按钮使用）</h3>
    <label>绘图标准文件路径
      <input id="cfg-standard-path" type="text" placeholder="例如 D:\模板\GB.drwdot" />
    </label>
    <label>图纸格式文件路径
      <input id="cfg-sheet-format-path" type="text" placeholder="例如 D:\模板\A3.slddrt" />
    </label>
    <button id="settings-save" type="button">保存设置</button>
  </section>

  <main id="toolbar" class="toolbar"></main>
  <div id="toast" class="toast" hidden></div>

  <!-- 编码整理模态框 -->
  <div id="modal-coding-cleanup" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <span>编码整理</span>
        <button class="modal-close" type="button" data-close>×</button>
      </div>
      <div class="modal-body">
        <label>名称过滤
          <input id="cc-name-filter" type="text" placeholder="留空则处理全部组件" />
        </label>
        <label><input id="cc-process-asm" type="checkbox" /> 处理装配体</label>
        <label><input id="cc-process-part" type="checkbox" /> 处理零件</label>
        <label><input id="cc-exclude-virtual" type="checkbox" /> 排除虚拟件</label>
        <label><input id="cc-exclude-standard" type="checkbox" /> 排除标准件</label>
        <label><input id="cc-exclude-purchased" type="checkbox" /> 排除外购件</label>
      </div>
      <div class="modal-footer">
        <button id="cc-execute" class="primary" type="button">执行</button>
        <button type="button" data-close>取消</button>
      </div>
    </div>
  </div>

  <!-- 重命名模态框 -->
  <div id="modal-rename" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <span>重命名</span>
        <button class="modal-close" type="button" data-close>×</button>
      </div>
      <div class="modal-body">
        <div class="rename-row">
          <label>原文件名
            <input id="rn-old-name" type="text" readonly />
          </label>
          <span id="rn-ext" class="rn-ext"></span>
        </div>
        <div class="rename-row">
          <label>新文件名
            <input id="rn-new-name" type="text" />
          </label>
          <span id="rn-name-status" class="rn-status"></span>
        </div>

        <details class="rename-params">
          <summary>重命名参数</summary>
          <label>属性目标
            <select id="rn-property-target">
              <option value="configuration">配置特定</option>
              <option value="custom">自定义</option>
            </select>
          </label>
          <label><input id="rn-write-filename" type="checkbox" /> 写文件名称</label>
          <label><input id="rn-write-material-code" type="checkbox" /> 写物料编码</label>
          <label><input id="rn-write-part-number" type="checkbox" /> 写零件图号</label>
          <label><input id="rn-write-design" type="checkbox" /> 写设计出图</label>
          <label>设计文本 <input id="rn-design-text" type="text" /></label>
          <label><input id="rn-write-version" type="checkbox" /> 写版本</label>
          <label>版本文本 <input id="rn-version-text" type="text" /></label>
        </details>
      </div>
      <div class="modal-footer">
        <button id="rn-rename" class="primary" type="button">重命名</button>
        <button id="rn-save-as" type="button">另存为</button>
        <button id="rn-save-as-replace" type="button">另存替换</button>
        <button type="button" data-close>取消</button>
      </div>
    </div>
  </div>

  <!-- 装配体排序模态框 -->
  <div id="modal-sort" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <span>装配体排序</span>
        <button class="modal-close" type="button" data-close>×</button>
      </div>
      <div class="modal-body">
        <label><input id="sort-assembly-first" type="checkbox" /> 装配体优先</label>
        <label><input id="sort-suppressed-last" type="checkbox" /> 压缩件靠后</label>
        <label><input id="sort-folders" type="checkbox" /> 按文件夹排序</label>
        <label><input id="sort-recursive" type="checkbox" /> 递归子装配体</label>
        <label><input id="sort-descending" type="checkbox" /> 降序</label>
        <label>名称来源
          <select id="sort-name-source">
            <option value="ComponentName">组件名</option>
            <option value="FileName">文件名</option>
          </select>
        </label>
      </div>
      <div class="modal-footer">
        <button id="sort-execute" class="primary" type="button">执行排序</button>
        <button type="button" data-close>取消</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
